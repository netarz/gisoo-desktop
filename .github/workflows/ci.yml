name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Third-party actions are pinned to full commit SHAs (the tag is in the comment).
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run build:prod

  package:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            files: release/*.exe
          - os: macos-latest
            platform: mac
            files: release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:prod

      # Signing is used only when the certificates are present as repository secrets; without them the
      # build still succeeds (Windows unsigned, macOS ad-hoc) so a fork can build the same installers.
      - name: Package for Windows
        if: matrix.platform == 'win'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$WIN_CSC_LINK" ]; then
            echo "Signing with the Windows certificate."
            npx electron-builder --win --publish never
          else
            echo "::warning::No Windows certificate configured; the installer is unsigned."
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --win --publish never
          fi

      - name: Package for macOS
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_API_KEY_BASE64" ]; then
            echo "Signing with Developer ID and notarizing."
            # Import the Developer ID certificate into a keychain of our own; electron-builder then finds
            # the identity there (its own CSC_LINK import fails on the hosted runners).
            P12="$RUNNER_TEMP/signing.p12"; KC="$RUNNER_TEMP/signing.keychain-db"; KCP="$(openssl rand -hex 16)"
            printf '%s' "$CSC_LINK" | base64 --decode > "$P12"
            security create-keychain -p "$KCP" "$KC"
            security set-keychain-settings -lut 21600 "$KC"
            security unlock-keychain -p "$KCP" "$KC"
            security import "$P12" -k "$KC" -P "$CSC_KEY_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security >/dev/null
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCP" "$KC" >/dev/null
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            rm -f "$P12"
            security find-identity -v -p codesigning "$KC" | sed -E 's/[0-9A-F]{40}/<hash>/'
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_KEYCHAIN="$KC"
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$APPLE_API_KEY"
            chmod 600 "$APPLE_API_KEY"
            npx electron-builder --mac --publish never -c.mac.notarize=true \
              -c.mac.identity="Ali Asghar Ramin (58W2XLMFW8)"
            rm -f "$APPLE_API_KEY"
            security delete-keychain "$KC"
          else
            echo "::warning::No Apple certificate configured; the app is ad-hoc signed and not notarized."
            unset CSC_LINK CSC_KEY_PASSWORD
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gisoo-${{ matrix.platform }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: |
          cd out
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/release-notes/${TAG}.md"
          [ -f "$notes" ] || notes=/dev/null
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --title "Gisoo Desktop ${TAG#v}" --notes-file "$notes" --verify-tag
